# Pinned to ubuntu-24.04 rather than ubuntu-latest: GitHub is migrating the
# ubuntu-latest label to 26.04 (rollout Oct 19-Nov 19, 2026), and runs during
# that window land on either image unpredictably, which broke the E2E job's
# Chromium install intermittently. Revisit once the rollout is complete.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:run

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    # Run inside Playwright's official image instead of `playwright install
    # --with-deps`: that apt-get call kept failing on a flaky DNS path to
    # Ubuntu's package mirror (azure.archive.ubuntu.com), repeatedly breaking
    # this job. The image ships Chromium + all OS deps pre-installed, so no
    # apt-get happens at all. Tag must match the @playwright/test version in
    # package-lock.json exactly — bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
