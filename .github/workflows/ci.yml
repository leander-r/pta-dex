# Pinned to ubuntu-24.04 rather than ubuntu-latest: GitHub is migrating the
# ubuntu-latest label to 26.04 (rollout Oct 19-Nov 19, 2026), and runs during
# that window land on either image unpredictably, which broke the E2E job's
# Chromium install intermittently. Revisit once the rollout is complete.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:run

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3: installing Chromium..."
            if timeout 150 npx playwright install chromium --with-deps; then
              echo "Chromium install succeeded."
              exit 0
            fi
            echo "Attempt $attempt failed — cleaning up before retrying."
            # timeout above sends SIGTERM to a hung apt-get, which can leave its
            # lock files held by the now-dead process — without this, every
            # subsequent retry fails instantly on "Could not get lock" instead
            # of getting a real second shot at the network.
            sudo pkill -9 -f apt-get || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
            rm -rf ~/.cache/ms-playwright
          done
          echo "All 3 attempts to install Chromium failed."
          exit 1

      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
